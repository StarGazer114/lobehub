[build]
command = "rm -rf .next node_modules/.cache && pnpm run build && echo SIZE_REPORT_START && du -sh .netlify/functions-internal/___netlify-server-handler && du -sh .netlify/functions-internal/___netlify-server-handler/node_modules/.pnpm/* 2>/dev/null | sort -h | tail -40 && echo SIZE_REPORT_END"
publish = ".next"

[build.environment]
NODE_OPTIONS = "--max-old-space-size=4096"
# Netlify build image defaults to Node 22; LobeHub needs >= 22.
NODE_VERSION = "22"

[[plugins]]
package = "@netlify/plugin-nextjs"

[template.environment]
OPENAI_API_KEY = "set your OpenAI API Key"
